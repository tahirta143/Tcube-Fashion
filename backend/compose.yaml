services:

  mysql:
    image: mysql:8.0
    container_name: tcube_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: tcube_fashions

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:

    build: .

    container_name: tcube_backend

    restart: always

    depends_on:
      - mysql

    ports:
      - "5000:5000"

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mysql_data: